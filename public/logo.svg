<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Emerald & Dark Slate Radial Background -->
    <radialGradient id="sfLogoBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <!-- Vibrant Mint to Emerald Gradient for Search Elements -->
    <linearGradient id="sfMintGlow" x1="60" y1="180" x2="440" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Search Bar Inner Dark Glass -->
    <linearGradient id="sfBarInner" x1="250" y1="170" x2="250" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#043c2f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#01221a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="sfLensGlass" x1="105" y1="210" x2="175" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#a7f3d0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <filter id="sfSearchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="500" height="500" rx="115" fill="url(#sfLogoBg)" />
  <rect width="494" height="494" x="3" y="3" rx="112" stroke="url(#sfMintGlow)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Subtle Decorative Islamic Geometric Backing Circle -->
  <circle cx="250" cy="250" r="200" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="8 8" />
  <circle cx="250" cy="250" r="160" stroke="#34d399" stroke-width="1" stroke-opacity="0.08" />

  <!-- Iconic Pill Search Bar Container -->
  <g filter="url(#sfSearchGlow)">
    <!-- Outer Search Bar Shape -->
    <rect x="45" y="170" width="410" height="160" rx="80" fill="url(#sfBarInner)" stroke="url(#sfMintGlow)" stroke-width="5" />

    <!-- Search Bar Inner Highlight / Top Lip -->
    <path d="M 125 174 L 375 174" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Classical Prominent Magnifying Glass (Search Icon) -->
    <!-- Glass Lens Outer Circle -->
    <circle cx="135" cy="250" r="42" stroke="url(#sfMintGlow)" stroke-width="9" fill="url(#sfLensGlass)" />

    <!-- Glass Reflection Highlight Arc -->
    <path d="M 112 232 A 28 28 0 0 1 148 214" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />

    <!-- Magnifying Glass Angled Solid Handle -->
    <line x1="166" y1="281" x2="202" y2="317" stroke="url(#sfMintGlow)" stroke-width="11" stroke-linecap="round" />
    <line x1="166" y1="281" x2="202" y2="317" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Vertical Active Search Cursor (Pulsing / Focused) -->
    <line x1="225" y1="215" x2="225" y2="285" stroke="#34d399" stroke-width="5" stroke-linecap="round" />

    <!-- Search Bar Query Placeholder Elements (Stylized 'Search Fatwa' Prompt Lines) -->
    <!-- Line 1: Primary query representation -->
    <rect x="246" y="225" width="125" height="12" rx="6" fill="#a7f3d0" fill-opacity="0.85" />
    <!-- Line 2: Secondary hint representation -->
    <rect x="246" y="248" width="75" height="10" rx="5" fill="#34d399" fill-opacity="0.5" />

    <!-- Search Action Capsule Pill inside the bar on the right -->
    <rect x="382" y="222" width="52" height="56" rx="20" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="2" />
    <!-- Mini Arrow or Spark inside the search trigger -->
    <path d="M 402 242 L 414 250 L 402 258" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Subtle Bottom Brand Accent -->
  <g opacity="0.6">
    <circle cx="250" cy="380" r="3" fill="#34d399" />
    <circle cx="230" cy="380" r="2" fill="#10b981" />
    <circle cx="270" cy="380" r="2" fill="#10b981" />
  </g>
</svg>
