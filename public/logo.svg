<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Forest Emerald & Charcoal Radial Background -->
    <radialGradient id="sfMagBg" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <!-- Vibrant Mint & Emerald Gradient for the Magnifying Glass Rim & Handle -->
    <linearGradient id="sfMagGlassGrad" x1="100" y1="90" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass Reflection Gradient inside the Lens -->
    <linearGradient id="sfMagLensReflection" x1="130" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#6ee7b7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>

    <!-- Handle Highlight Gradient -->
    <linearGradient id="sfMagHandleHighlight" x1="260" y1="260" x2="385" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="sfMagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Container Tile -->
  <rect width="500" height="500" rx="115" fill="url(#sfMagBg)" />
  <rect width="494" height="494" x="3" y="3" rx="112" stroke="url(#sfMagGlassGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Pure Magnifying Glass (Search Icon) - Perfectly Centered -->
  <g filter="url(#sfMagGlow)">
    <!-- Lens Transparent Glass Fill -->
    <circle cx="210" cy="205" r="115" fill="url(#sfMagLensReflection)" />

    <!-- Solid Angled Handle (45 degrees down-right) -->
    <!-- Handle Outer Body -->
    <line
      x1="292"
      y1="287"
      x2="395"
      y2="390"
      stroke="url(#sfMagGlassGrad)"
      stroke-width="38"
      stroke-linecap="round"
    />
    <!-- Handle Grip Detail / Inner Core -->
    <line
      x1="298"
      y1="293"
      x2="388"
      y2="383"
      stroke="url(#sfMagHandleHighlight)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-opacity="0.75"
    />

    <!-- Magnifying Glass Rim (Circular Ring) -->
    <circle
      cx="210"
      cy="205"
      r="115"
      stroke="url(#sfMagGlassGrad)"
      stroke-width="30"
      fill="none"
    />

    <!-- Glass Specular Highlight Curve (Reflection Arc on top-left of lens) -->
    <path
      d="M 140 160 A 85 85 0 0 1 230 115"
      stroke="#ffffff"
      stroke-width="10"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />
    <!-- Secondary Subtle Lower Highlight Dot -->
    <circle cx="132" cy="190" r="5" fill="#ffffff" fill-opacity="0.6" />
  </g>
</svg>
