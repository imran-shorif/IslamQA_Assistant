<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Forest Emerald & Charcoal Radial Background -->
    <radialGradient id="sfFavMagBg" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="55%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <!-- Vibrant Mint & Emerald Gradient for the Magnifying Glass Rim & Handle -->
    <linearGradient id="sfFavMagGrad" x1="100" y1="90" x2="410" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glass Reflection Gradient inside the Lens -->
    <linearGradient id="sfFavMagReflection" x1="130" y1="120" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#6ee7b7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>

    <!-- Handle Highlight Gradient -->
    <linearGradient id="sfFavMagHandle" x1="260" y1="260" x2="385" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container Tile -->
  <rect width="500" height="500" rx="115" fill="url(#sfFavMagBg)" />
  <rect width="494" height="494" x="3" y="3" rx="112" stroke="url(#sfFavMagGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Pure Magnifying Glass (Search Icon) -->
  <g>
    <!-- Lens Transparent Glass Fill -->
    <circle cx="210" cy="205" r="115" fill="url(#sfFavMagReflection)" />

    <!-- Solid Angled Handle (45 degrees down-right) -->
    <line
      x1="292"
      y1="287"
      x2="395"
      y2="390"
      stroke="url(#sfFavMagGrad)"
      stroke-width="42"
      stroke-linecap="round"
    />
    <line
      x1="298"
      y1="293"
      x2="388"
      y2="383"
      stroke="url(#sfFavMagHandle)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-opacity="0.8"
    />

    <!-- Magnifying Glass Rim (Circular Ring) -->
    <circle
      cx="210"
      cy="205"
      r="115"
      stroke="url(#sfFavMagGrad)"
      stroke-width="34"
      fill="none"
    />

    <!-- Glass Specular Highlight Curve (Reflection Arc) -->
    <path
      d="M 140 160 A 85 85 0 0 1 230 115"
      stroke="#ffffff"
      stroke-width="12"
      stroke-linecap="round"
      stroke-opacity="0.9"
    />
    <circle cx="132" cy="190" r="6" fill="#ffffff" fill-opacity="0.7" />
  </g>
</svg>
