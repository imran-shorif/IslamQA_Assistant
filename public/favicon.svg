<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Emerald & Dark Slate Radial Background -->
    <radialGradient id="sfFavBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011712" />
    </radialGradient>

    <!-- Vibrant Mint to Emerald Gradient for Search Elements -->
    <linearGradient id="sfFavMint" x1="60" y1="180" x2="440" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#34d399" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Search Bar Inner Dark Glass -->
    <linearGradient id="sfFavBar" x1="250" y1="170" x2="250" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#043c2f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#01221a" stop-opacity="0.98" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="sfFavGlass" x1="105" y1="210" x2="175" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#a7f3d0" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="500" height="500" rx="115" fill="url(#sfFavBg)" />
  <rect width="494" height="494" x="3" y="3" rx="112" stroke="url(#sfFavMint)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Iconic Pill Search Bar Container -->
  <g>
    <!-- Outer Search Bar Shape -->
    <rect x="45" y="170" width="410" height="160" rx="80" fill="url(#sfFavBar)" stroke="url(#sfFavMint)" stroke-width="6" />

    <!-- Classical Prominent Magnifying Glass (Search Icon) -->
    <circle cx="135" cy="250" r="42" stroke="url(#sfFavMint)" stroke-width="11" fill="url(#sfFavGlass)" />

    <!-- Glass Reflection Highlight Arc -->
    <path d="M 112 232 A 28 28 0 0 1 148 214" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" />

    <!-- Magnifying Glass Angled Solid Handle -->
    <line x1="166" y1="281" x2="204" y2="319" stroke="url(#sfFavMint)" stroke-width="13" stroke-linecap="round" />
    <line x1="166" y1="281" x2="204" y2="319" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Vertical Active Search Cursor -->
    <line x1="228" y1="215" x2="228" y2="285" stroke="#34d399" stroke-width="7" stroke-linecap="round" />

    <!-- Search Query Representation lines -->
    <rect x="252" y="224" width="120" height="14" rx="7" fill="#a7f3d0" fill-opacity="0.9" />
    <rect x="252" y="250" width="75" height="12" rx="6" fill="#34d399" fill-opacity="0.6" />

    <!-- Search Action Capsule Pill -->
    <rect x="382" y="222" width="52" height="56" rx="20" fill="#10b981" fill-opacity="0.35" stroke="#34d399" stroke-width="2.5" />
    <path d="M 402 242 L 414 250 L 402 258" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
